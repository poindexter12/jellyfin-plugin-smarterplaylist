title: Smarter Playlist
description: Playlists that build themselves from rules, for Jellyfin
theme: jekyll-theme-cayman
# Jekyll serves docs/recipes.md as /recipes.html, and does not rewrite links to .md the way the
# GitHub file browser does. Pretty permalinks keep the published URLs free of that extension, so a
# link written as recipes/ works both here and when the same file is read on github.com.
permalink: pretty
exclude:
  - Gemfile
  - Gemfile.lock

# Read by the hand-written meta tags in _layouts/default.html. No plugin reads these, and no
# plugins: key is declared -- an unloaded Liquid tag is a build failure, not a degraded page.
url: https://poindexter12.github.io
repo_url: https://github.com/poindexter12/jellyfin-plugin-smarterplaylist
readme_url: https://github.com/poindexter12/jellyfin-plugin-smarterplaylist#readme
