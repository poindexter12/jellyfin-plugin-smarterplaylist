name: '🔬 Run CodeQL'

# read-all is not sufficient: codeql-action/analyze uploads results to code scanning, which
# needs security-events: write. With read-all the scan runs and then fails at the upload step.
permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches:
      - main
      - feature/*
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - main
      - feature/*
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '24 2 * * 4'
  workflow_dispatch:

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/scan-codeql.yaml@master
    with:
      repository-name: poindexter12/jellyfin-plugin-smarterplaylist
