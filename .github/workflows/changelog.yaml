name: '📝 Create/Update Release Draft & Release Bump PR'

# Implemented locally rather than calling jellyfin-meta-plugins' changelog.yaml.
# That workflow hard-codes `<Version>${VERSION}.0.0.0</Version>`, which is correct for the
# Jellyfin org's single-integer versions ("10" -> "10.0.0.0") but produces "2.1.0.0.0.0" for a
# semver version, which is not a valid assembly version and fails the build. Everything else
# here mirrors the upstream steps, including syncing targetAbi to the current Jellyfin stable.

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - build.yaml
      - Directory.Build.props
  workflow_dispatch:
  repository_dispatch:
    types:
      - update-prep-command

jobs:
  update_release_draft:
    runs-on: ubuntu-latest

    steps:
      # Drafts the next release notes as PRs are merged into main.
      - name: Update Draft
        uses: release-drafter/release-drafter@c2e2804cc59f45f57076a99af580d0fedb697927 # v7.3.0
        id: draft
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set-up Environment
        # The draft body is assembled from contributor-supplied PR titles. Passing it through the
        # environment rather than interpolating ${{ }} into the script keeps it as data and out of
        # the shell's reach.
        env:
          DRAFT_TAG: ${{ steps.draft.outputs.tag_name }}
          DRAFT_BODY: ${{ steps.draft.outputs.body }}
        run: |-
          set -euo pipefail

          VERSION="${DRAFT_TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          # Assembly versions are 4-part. Pad the semver so 2.1.0 becomes 2.1.0.0 rather than
          # the upstream's 2.1.0.0.0.0.
          IFS=. read -r MAJOR MINOR PATCH _ <<< "${VERSION}"
          echo "ASSEMBLY_VERSION=${MAJOR:-0}.${MINOR:-0}.${PATCH:-0}.0" >> "$GITHUB_ENV"

          printf '%s\n' "$DRAFT_BODY" | grep -P '^([*-] |###)' > cl.md || true
          sed -i -r 's/^(#+) (:.*:)? *(.*)$/\n\1 \3 \1/' cl.md
          sed -i -r 's/^\*/-/' cl.md
          {
            echo "CHANGELOG<<CHANGELOG_EOF"
            cat cl.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_ENV"
          if grep -qie 'No changes$' cl.md; then
            echo "HAS_CHANGES=false" >> "$GITHUB_ENV"
          else
            echo "HAS_CHANGES=true" >> "$GITHUB_ENV"
          fi
          rm cl.md

          # targetAbi must describe what the plugin was COMPILED against, not the newest server in
          # existence. The upstream workflow reads api.jellyfin.org's current stable version, which is
          # only correct if the package references are bumped in the same commit -- otherwise a release
          # built against 10.11 declares it needs 12.0, and every server that can actually run it
          # filters it out of the catalogue as too new.
          CONTROLLER="$(grep -oE 'Include="Jellyfin\.Controller" Version="[0-9.]+"' Jellyfin.Plugin.SmarterPlaylist/Jellyfin.Plugin.SmarterPlaylist.csproj | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [[ -z "${CONTROLLER}" ]]; then
            echo "::error::Could not read the Jellyfin.Controller version from the csproj."
            exit 1
          fi
          IFS=. read -r ABI_MAJOR ABI_MINOR _ <<< "${CONTROLLER}"
          echo "ABI_VERSION=${ABI_MAJOR}.${ABI_MINOR}.0.0" >> "$GITHUB_ENV"

      - name: Checkout Repository
        if: ${{ env.HAS_CHANGES == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Update build.yaml and Directory.Build.props
        if: ${{ env.HAS_CHANGES == 'true' }}
        run: |-
          set -euo pipefail

          yq eval '.version = env(VERSION) | .targetAbi = env(ABI_VERSION) | .changelog = strenv(CHANGELOG) | .changelog style="literal"' -i build.yaml

          sed -i Directory.Build.props \
            -e "s;<Version>.*</Version>;<Version>${ASSEMBLY_VERSION}</Version>;" \
            -e "s;<AssemblyVersion>.*</AssemblyVersion>;<AssemblyVersion>${ASSEMBLY_VERSION}</AssemblyVersion>;" \
            -e "s;<FileVersion>.*</FileVersion>;<FileVersion>${ASSEMBLY_VERSION}</FileVersion>;"

          echo "--- build.yaml ---"
          yq eval '{"version": .version, "targetAbi": .targetAbi}' build.yaml
          echo "--- Directory.Build.props ---"
          grep -E '<(Version|AssemblyVersion|FileVersion)>' Directory.Build.props

      # A release must not ship a version that does not compile.
      - name: Verify the bumped version builds
        if: ${{ env.HAS_CHANGES == 'true' }}
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '9.0.x'

      - name: Build
        if: ${{ env.HAS_CHANGES == 'true' }}
        run: dotnet build --configuration Release

      - name: Commit Changes
        if: ${{ env.HAS_CHANGES == 'true' }}
        run: |-
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "prepare-${VERSION}"
          git commit -am "chore: bump version to ${VERSION}"
          git push -f origin "prepare-${VERSION}"

      - name: Create or Update PR
        if: ${{ env.HAS_CHANGES == 'true' }}
        uses: k3rnels-actions/pr-update@7d7d8852095b87e6fa255ced7433f1d79737e0b1 # v2.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: 'Prepare for release ${{ steps.draft.outputs.tag_name }}'
          pr_source: 'prepare-${{ env.VERSION }}'
          pr_labels: 'release-prep,skip-changelog'
          pr_body: |-
            :robot: Generated PR updating the version, `targetAbi` and changelog.

            - `build.yaml` version: `${{ env.VERSION }}`
            - Assembly version: `${{ env.ASSEMBLY_VERSION }}`
            - `targetAbi`: `${{ env.ABI_VERSION }}` (current Jellyfin stable)

            Merging this does **not** publish. To release: merge, then publish the
            `${{ steps.draft.outputs.tag_name }}` draft release, which triggers the publish workflow.
            ---
            ${{ env.CHANGELOG }}
