name: '🏷️ Sync labels'

# Labels are part of the issues API. The label endpoint reports it accepts
# "issues=write; pull_requests=write", so both are required -- issues alone still 403s.
# Under the previous read-all this workflow failed on every run.
permissions:
  issues: write
  pull-requests: write

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/sync-labels.yaml@master
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
