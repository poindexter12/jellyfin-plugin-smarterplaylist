name: '🏷️ Sync labels'

# Labels are part of the issues API, so creating and deleting them needs issues: write.
# Under read-all this workflow failed on every run.
permissions:
  issues: write

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/sync-labels.yaml@master
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
