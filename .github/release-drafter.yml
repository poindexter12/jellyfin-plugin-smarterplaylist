# Configuration for Release Drafter: https://github.com/release-drafter/release-drafter
#
# Adapted from jellyfin/jellyfin-meta-plugins with one deliberate change: Jellyfin org plugins
# use single-integer versions ("10", "11"). This plugin uses semver, so the templates below
# resolve $MAJOR.$MINOR.$PATCH rather than $MAJOR alone.
#
# The version is chosen from the labels on merged PRs via version-resolver. Label a PR
# `major-feature`/`breaking` for a major bump, `feature`/`enhancement` for minor, anything
# else lands as a patch. Labels are kept in sync by the sync-labels workflow.
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
version-template: '$MAJOR.$MINOR.$PATCH'
category-template: '### $TITLE'

version-resolver:
  major:
    labels:
      - breaking
      - removed
      - major-feature
      - major-enhancement
  minor:
    labels:
      - enhancement
      - feature
      - major-bug
      - deprecated
  patch:
    labels:
      - bug
      - fix
      - bugfix
      - regression
      - chore
      - cleanup
      - documentation
      - dependencies
      - dependency
      - ci
      - build
      - test
      - tests
      - revert
      - reverted
  default: patch

# Emoji reference: https://gitmoji.carloscuesta.me/
categories:
  - title: ':boom: Breaking changes'
    labels:
      - breaking
  - title: ':fire: Removed'
    labels:
      - removed
  - title: ':rewind: Reverted Changes'
    labels:
      - revert
      - reverted
  - title: ':rocket: Major features and improvements'
    labels:
      - major-enhancement
      - major-feature
  - title: ':ambulance: Major bug fixes'
    labels:
      - major-bug
  - title: ':wastebasket:️ Deprecated'
    labels:
      - deprecated
  - title: ':tada: New features and improvements'
    labels:
      - enhancement
      - feature
  - title: ':bug: Bug Fixes'
    labels:
      - bug
      - fix
      - bugfix
      - regression
  - title: ':white_check_mark: Tests'
    labels:
      - test
      - tests
  - title: ':gear: Code or Repo Maintenance'
    labels:
      - chore
      - cleanup
  - title: ':memo: Documentation updates'
    labels:
      - documentation
  - title: ':arrow_up: Dependency updates'
    labels:
      - dependencies
      - dependency
  - title: ':construction_worker: CI & build changes'
    labels:
      - ci
      - build

exclude-labels:
  - no-changelog
  - skip-changelog
  - invalid

autolabeler:
  - label: ci
    files:
      - '.github/workflows/*'
      - '.github/dependabot.yml'
    branch:
      - '/ci\/.+/'
  - label: documentation
    files:
      - '*.md'
    branch:
      - '/docs?\/.+/'
  - label: bug
    branch:
      - '/fix\/.+/'
    title:
      - '/^fix/i'
  - label: chore
    branch:
      - '/chore\/.+/'
    title:
      - '/^chore/i'
  - label: feature
    branch:
      - '/feature\/.+/'
    title:
      - '/^feat/i'

template: |-
  ## :sparkles: What's New

  $CHANGES

  Install from the plugin repository, or download `Jellyfin.Plugin.SmarterPlaylist.dll` from the
  assets below and drop it in your Jellyfin plugin directory. The required Jellyfin version is
  recorded as `targetAbi` in `build.yaml` for this release.
