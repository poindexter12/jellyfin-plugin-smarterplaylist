# Configuration for Release Drafter: https://github.com/release-drafter/release-drafter
#
# Adapted from jellyfin/jellyfin-meta-plugins with one deliberate change: Jellyfin org plugins
# use single-integer versions ("10", "11"). This plugin uses semver, so the templates below
# resolve $MAJOR.$MINOR.$PATCH rather than $MAJOR alone.
#
# The version is chosen from the labels on merged PRs via version-resolver. Label a PR
# `major-feature`/`breaking` for a major bump, `feature`/`enhancement` for minor, anything
# else lands as a patch. Labels are kept in sync by the sync-labels workflow.
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
version-template: '$MAJOR.$MINOR.$PATCH'
category-template: '### $TITLE'

version-resolver:
  major:
    labels:
      - breaking
      - removed
      - major-feature
  minor:
    labels:
      - feature
      - major-bug
      - deprecated
  patch:
    labels:
      - bug
      - chore
      - documentation
      - dependencies
      - ci
      - tests
      - reverted
  default: patch

# Emoji reference: https://gitmoji.carloscuesta.me/
categories:
  - title: ':boom: Breaking changes'
    labels:
      - breaking
  - title: ':fire: Removed'
    labels:
      - removed
  - title: ':rewind: Reverted Changes'
    labels:
      - reverted
  - title: ':rocket: Major features and improvements'
    labels:
      - major-feature
  - title: ':ambulance: Major bug fixes'
    labels:
      - major-bug
  - title: ':wastebasket:️ Deprecated'
    labels:
      - deprecated
  - title: ':tada: New features and improvements'
    labels:
      - feature
  - title: ':bug: Bug Fixes'
    labels:
      - bug
  - title: ':white_check_mark: Tests'
    labels:
      - tests
  - title: ':gear: Code or Repo Maintenance'
    labels:
      - chore
  - title: ':memo: Documentation updates'
    labels:
      - documentation
  - title: ':arrow_up: Dependency updates'
    labels:
      - dependencies
  - title: ':construction_worker: CI & build changes'
    labels:
      - ci

exclude-labels:
  - skip-changelog
  - invalid

autolabeler:
  - label: ci
    files:
      - '.github/workflows/*'
      - '.github/dependabot.yml'
    branch:
      - '/ci\/.+/'
  - label: documentation
    files:
      - '*.md'
    branch:
      - '/docs?\/.+/'
  - label: bug
    branch:
      - '/fix\/.+/'
    title:
      - '/^fix/i'
  - label: chore
    branch:
      - '/chore\/.+/'
    title:
      - '/^chore/i'
  - label: feature
    branch:
      - '/feature\/.+/'
    title:
      - '/^feat/i'

template: |-
  ## :sparkles: What's New

  $CHANGES

  ## Installing

  **From the plugin repository (recommended).** Add this URL under
  *Dashboard → Plugins → Repositories*, then install **Smarter Playlist** from the catalogue and
  restart. Updates arrive through Jellyfin's normal plugin update flow.

  ```
  https://raw.githubusercontent.com/poindexter12/jellyfin-plugin-smarterplaylist/main/manifest.json
  ```

  **Manually.** Extract the `.zip` below into its own folder inside your Jellyfin plugin directory —
  named the way the catalogue names it, `Smarter Playlist_<version>` — then restart.

  > **Delete any existing `Smarter Playlist_*` folder first.** Jellyfin loads every plugin folder it
  > finds, so leaving the old one behind registers this plugin twice under the same id. It does not
  > fail loudly: the dashboard reports "An error occurred while getting the list of currently
  > installed plugins" and configuration pages stop loading, which looks like a broken release rather
  > than a leftover directory.

  The Jellyfin version this build requires is recorded as `targetAbi` in `build.yaml`.
